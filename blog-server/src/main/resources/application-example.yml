server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog_java_vue?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:blog}
    # 不提供默认密码；真实值只允许来自运行环境或外部密钥管理器。
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      database: ${REDIS_DATABASE:0}
  mail:
    # 邮件功能默认关闭；启用时 host/username/password 均由环境变量注入。
    host: ${BLOG_MAIL_HOST:localhost}
    port: ${BLOG_MAIL_PORT:1025}
    username: ${BLOG_MAIL_USERNAME:}
    password: ${BLOG_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${BLOG_MAIL_SMTP_AUTH:false}
          ssl:
            enable: ${BLOG_MAIL_SSL:false}
          starttls:
            enable: ${BLOG_MAIL_STARTTLS:false}

blog:
  # 外发确认/退订链接的可信根地址；生产环境必须显式设置。
  site-base-url: ${BLOG_SITE_BASE_URL:}
  jwt:
    # 必填；用 `openssl rand -base64 64` 生成，空值会让 JwtUtil 拒绝启动。
    secret: ${BLOG_JWT_SECRET:}
    expiration: ${BLOG_JWT_EXPIRATION:7200000}
    header: Authorization
    prefix: "Bearer "
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - ${FRONTEND_ORIGIN:}
      - ${FRONTEND_ORIGIN_WWW:}
  local-storage:
    dir: ${UPLOAD_DIR:./uploads/img}
    base-url: ${IMG_BASE_URL:}
  visit-log:
    include-local-ip: false
    session-interval-seconds: ${VISIT_SESSION_INTERVAL_SECONDS:30}
  ip2-region:
    db-path: ${IP2_REGION_DB_PATH:classpath:ip2region.xdb}
  site:
    url: ${SITE_URL:http://localhost:5173}
  mail:
    enabled: ${BLOG_MAIL_ENABLED:false}
    from-email: ${BLOG_MAIL_FROM_EMAIL:${spring.mail.username:}}
    from-name: ${BLOG_MAIL_FROM_NAME:Blog}
    admin-email: ${BLOG_MAIL_ADMIN_EMAIL:}
  subscribe:
    confirm-base-url: ${BLOG_SUBSCRIBE_BASE_URL:}
    site-name: ${BLOG_SUBSCRIBE_SITE_NAME:MyBlog}
  notify:
    enabled: ${BLOG_NOTIFY_ENABLED:false}
    base-url: ${BLOG_NOTIFY_BASE_URL:}
    interval-ms: ${BLOG_NOTIFY_INTERVAL:300000}

# 新库管理员没有默认密码。首次启动时临时设置：
#   BLOG_ADMIN_INITIAL_PASSWORD=<至少 12 位强密码>
# 应用写入 BCrypt 后立即从环境中删除该变量；后续密码只保存在数据库摘要中。
