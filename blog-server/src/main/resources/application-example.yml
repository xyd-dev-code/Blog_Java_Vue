spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/blog_java_vue?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 改用环境变量,不要把真实密码写进仓库
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      database: 0

blog:
  jwt:
    # 用 `openssl rand -base64 64` 生成一个强随机密钥
    secret: ${JWT_SECRET}
    expiration: 604800000  # 7 days
    header: Authorization
    prefix: "Bearer "
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5173
      - ${FRONTEND_ORIGIN:https://yourdomain.com}
      - ${FRONTEND_ORIGIN_WWW:https://www.yourdomain.com}
  local-storage:
    # 本地开发示例;生产请用绝对路径并保证 nginx/www-data 有读权限
    dir: ${UPLOAD_DIR:./uploads/img}
    base-url: ${IMG_BASE_URL:https://img.yourdomain.com}