name: Build and regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test against isolated H2 and package
        run: mvn -B -Dspring.config.name=application-example verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blog-web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:review
