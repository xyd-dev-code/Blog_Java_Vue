name: Privacy leak scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan-current-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Scan tracked files without printing secret values
        shell: pwsh
        run: ./scripts/privacy-scan.ps1 -TrackedOnly
